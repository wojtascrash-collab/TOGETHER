name: TOGETHER checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - run: npm install --no-save --ignore-scripts @electric-sql/pglite@0.3.14
      - run: npm run test:db
